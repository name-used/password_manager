<title>离线账本查看器</title>
<style>
:root {color-scheme:dark; font-family:system-ui,-apple-system,'Segoe UI',sans-serif; color:#e6edf4; background:#0c1420}

.shell {max-width:960px; margin:auto; padding:18px 20px 24px}
header {display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px} h1 {font-size:24px; margin:0}
.quiet {color:#8fa2b9; font-size:13px; line-height:1.7} .badge {display:inline-block; padding:6px 10px; border-radius:20px; background:#173b35; color:#9fe8d5; font-size:12px}
.panel {border:1px solid #2d3d52; background:#141f2e; border-radius:12px; padding:13px}
.source {margin-bottom:10px} summary {cursor:pointer; font-weight:650; color:#d8e6f4; padding:1px 0}
.source textarea {height:130px; margin:9px 0 7px; font:12px/1.55 ui-monospace,Consolas,monospace}
textarea,input {color:#e9eff7; background:#0b1522; border:1px solid #36495f; border-radius:8px; padding:11px 12px; width:100%; outline:none}
textarea {resize:vertical} textarea:focus,input:focus {border-color:#64d9bc; box-shadow:0 0 0 2px #64d9bc1a}

button:hover {background:#2a3d54} button.primary {background:#66dcc1; color:#082a24; border-color:#66dcc1; font-weight:700}
button.primary:hover {background:#8ae8d1} button:disabled,input:disabled,textarea:disabled {opacity:.5; cursor:default}
.actions {display:flex; gap:9px; flex-wrap:wrap; align-items:center}
.workspace {display:grid; grid-template-columns:220px minmax(0,1fr); gap:12px; align-items:start}
.list-head {display:flex; justify-content:space-between; align-items:center; margin-bottom:8px}

<main class="shell">
  <header>
    <h1>离线账本查看器</h1>
    <div class="actions"><button id="open">打开账本文件</button><button id="save-book" disabled>下载账本副本</button></div>
  </header>
  <details class="panel source" id="source-panel">
    <summary>粘贴账本文本</summary>
    <textarea id="source" aria-label="账本文本" placeholder="将从桌面管理端复制的完整账本粘贴到这里。&#10;&#10;[账本]&#10;格式：3&#10;校验样本：…&#10;&#10;[条目]&#10;服务名：…" spellcheck="false" autocomplete="off"></textarea>
    <div class="actions">
      <button id="load" class="primary">读取粘贴内容</button>
      <button id="clear-book">清空页面</button>
    </div>
    <input type="file" id="file" accept=".vault,.txt,text/plain" hidden>
  </details>
  <section class="panel book-password" id="master-panel" aria-label="管理密码">
    <div id="master-form">
      <label for="master">管理密码</label>
      <div class="master-row"><input type="password" id="master" autocomplete="off" spellcheck="false" autocapitalize="off" disabled><button id="verify" class="primary" disabled>验证密码</button></div>
      <label class="reveal-password"><input type="checkbox" id="show-master" disabled>显示管理密码</label>
    </div>
    <div class="actions"><span id="master-state" class="quiet"></span><button id="change-master" hidden>换用管理密码</button></div>
  </section>
  <div id="status" role="status" aria-live="polite">打开账本文件或粘贴账本文本。</div>
  <div class="workspace">
    <aside class="panel">
      <div class="list-head"><h2>条目</h2><span id="count" class="quiet">未读取账本</span></div>
      <input id="search" aria-label="搜索条目" placeholder="搜索条目" autocomplete="off" spellcheck="false" disabled>
      <div id="entries"><div class="empty">请打开账本文件，或粘贴账本文本。</div></div>
    </aside>
    <section class="panel" aria-label="条目详情">
      <div id="no-selection" class="empty">验证管理密码后，选择条目即可查看密码。</div>
      <div id="detail" hidden>
        <div class="detail-head"><div><h2 id="detail-title"></h2><div id="detail-user" class="quiet"></div></div><span class="badge" id="entry-state"></span></div>
        <div class="password-label"><label for="plaintext">条目密码</label><span id="plaintext-state" class="quiet">未解密</span></div>
        <textarea id="plaintext" readonly placeholder="验证后可显示或复制条目密码" spellcheck="false" autocomplete="off"></textarea>
        <div class="actions secret-actions">
          <label class="reveal-password"><input type="checkbox" id="show-password" disabled>显示密码</label>
          <button id="copy-password" disabled>复制密码</button>
          <button id="retry" hidden>重试解密</button>
        </div>
        <details id="public-details" class="public-details">
          <summary>公开资料和加密参数</summary>
          <dl id="metadata"></dl>
          <div class="crypto-note" id="crypto-info"></div>
        </details>
      </div>
    </section>
  </div>
  <footer class="quiet">本页离线运行。切换账本会清空管理密码和解密结果。</footer>
</main>

    const url = URL.createObjectURL(file);
    const link = document.createElement('a');
    link.href = url;
    link.download = '账本.txt';
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showStatus('已发起下载。请在浏览器的下载列表中查看“账本.txt”。');
}

function confirmCost({memory_kib, iterations, lanes}) {
    return (memory_kib <= 65536 && iterations <= 3 && lanes <= 4) || confirm('此次计算的参数较高，可能耗时较长或占用更多内存。继续吗？');
}

function showDecrypted(password, start) {
    viewer.plaintext = password;
    renderPlaintext();
    ui['plaintext-state'].textContent = password ? '已解密' : '已解密（密码为空）';
    showStatus(`解密成功，用时 ${((performance.now() - start) / 1000).toFixed(3)} 秒。`);
}

async function verifyMaster() {
    if (ui.verify.disabled) return;
    const {book} = viewer;
    const entry = selectedEntry();
    const sample = verificationSample();
    const master = ui.master.value;
    if (!confirmCost(sample)) return;
    viewer.busy = true;
    refreshControls();
    showStatus('正在验证管理密码。');
    try {
        await new Promise(resolve => setTimeout(resolve, 0));
        const start = performance.now();
        const result = book.verifier ? await VaultProcess.verify(sample, master) : await VaultProcess.decrypt(book.book_code, sample, master);
        if (viewer.book !== book || ui.source.value !== viewer.loadedText || ui.master.value !== master) return;
        viewer.verified = true;
        if (!book.verifier && sample === entry) showDecrypted(result, start);
        else showStatus('管理密码已验证。选择条目即可解密。');
    } catch (error) {
        showStatus(`管理密码验证失败。${error.message}`, true);
    } finally {
        viewer.busy = false;
        refreshControls();
    }
    if (viewer.verified && book.verifier && entry?.data) await decryptSelected();
}

async function decryptSelected() {
    const entry = selectedEntry();
    if (viewer.busy || !viewer.verified || !entry?.data || ui.source.value !== viewer.loadedText) return;
    const {book} = viewer;
    const master = ui.master.value;
    if (!confirmCost(entry)) return;
    viewer.busy = true;
    refreshControls();
    showStatus(`正在解密“${entry.service || '未命名服务'}”的密码。`);
    try {
        await new Promise(resolve => setTimeout(resolve, 0));
        const start = performance.now();
        const password = await VaultProcess.decrypt(book.book_code, entry, master);
        if (viewer.verified && viewer.book === book && ui.source.value === viewer.loadedText && ui.master.value === master) showDecrypted(password, start);
    } catch (error) {
        if (error.code === 'AUTHENTICATION_FAILED') {
            showStatus('条目校验失败。密码密文、随机码或加密参数可能已改动，或这条使用了其他管理密码。', true);
        } else {
            showStatus(`无法解密条目密码。${error.message}`, true);
        }
    } finally {
        viewer.busy = false;
        refreshControls();
    }
}

async function copyPassword() {
    const password = viewer.plaintext;
    if (password === null || viewer.busy) return;
    try {
        await navigator.clipboard.writeText(password);
        if (viewer.plaintext === password) showStatus('条目密码已复制。');
    } catch (_) {
        if (viewer.plaintext !== password || viewer.busy) return;
        if (!password) return showStatus('浏览器无法自动复制。条目密码为空。');
        if (!ui['show-password'].checked) return showStatus('浏览器无法自动复制。请勾选“显示密码”后手动复制。');
        ui.plaintext.focus();
        ui.plaintext.select();
        ui.plaintext.setSelectionRange(0, ui.plaintext.value.length);
        showStatus('浏览器无法自动复制。已选中条目密码，请手动复制。');
    }
}

ui.load.addEventListener('click', () => loadBook(ui.source.value === viewer.loadedText ? viewer.fileBytes : null));
ui['save-book'].addEventListener('click', saveBook);
ui.source.addEventListener('input', () => {
    clearPlaintext(true);
    if (viewer.book && ui.source.value !== viewer.loadedText) showStatus('粘贴内容已更改，请重新读取。');
});
ui.search.addEventListener('input', renderEntries);
ui.verify.addEventListener('click', verifyMaster);
ui.master.addEventListener('keydown', event => {if (event.key === 'Enter') verifyMaster();});
ui.master.addEventListener('input', () => {
    viewer.verified = false;
    clearPlaintext();
});
ui['show-master'].addEventListener('change', () => {ui.master.type = ui['show-master'].checked ? 'text' : 'password';});
ui['show-password'].addEventListener('change', renderPlaintext);
ui['copy-password'].addEventListener('click', copyPassword);
ui.retry.addEventListener('click', decryptSelected);
ui['change-master'].addEventListener('click', () => {
    if (viewer.busy) return;
    clearPlaintext(true);
    ui.master.focus();
    showStatus('请输入该条目使用的管理密码。');
});
ui.open.addEventListener('click', () => ui.file.click());
ui.file.addEventListener('change', async () => {
    const file = ui.file.files[0];
    if (!file || viewer.busy) return;
    viewer.busy = true;
    clearPlaintext(true);
    try {
        const fileBytes = await file.arrayBuffer();
        ui.source.value = new TextDecoder().decode(fileBytes);
        viewer.busy = false;
        loadBook(fileBytes, '无法读取账本文件内容');
    } catch {
        showStatus('无法打开所选文件。请检查文件是否仍可访问。', true);
    } finally {
        viewer.busy = false;
        ui.file.value = '';
        refreshControls();
    }
});
ui['clear-book'].addEventListener('click', () => {
    if (viewer.busy) return;
    viewer.book = null;
    viewer.index = null;
    viewer.loadedText = '';
    viewer.fileBytes = null;
    ui.source.value = '';
    ui.search.value = '';
    ui.detail.hidden = true;
    ui['no-selection'].hidden = false;
    ui['source-panel'].open = true;
    clearPlaintext(true);
    renderEntries();
    showStatus('页面已清空。');
});
refreshControls();

</script>
</html>
