<!doctype html>
<!--
__STANDARD_LIBRARY_NOTICES__
-->
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>离线账本查看器</title>
<style>
:root {color-scheme:dark; font-family:system-ui,-apple-system,'Segoe UI',sans-serif; color:#e6edf4; background:#0c1420}
* {box-sizing:border-box} body {margin:0} button,input,textarea {font:inherit} button {cursor:pointer}
.shell {max-width:1180px; margin:auto; padding:28px 24px 36px} .brand {color:#63d8bc; font-size:12px; letter-spacing:.2em}
header {display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:22px} h1 {font-size:28px; margin:5px 0 0; letter-spacing:.02em}
.quiet {color:#8fa2b9; font-size:13px; line-height:1.7} .badge {display:inline-block; padding:6px 10px; border-radius:20px; background:#173b35; color:#9fe8d5; font-size:12px}
.panel {border:1px solid #2d3d52; background:#141f2e; border-radius:15px; padding:20px}
.source {margin-bottom:20px} summary {cursor:pointer; font-weight:650; color:#d8e6f4; padding:1px 0}
.source textarea {height:185px; margin:14px 0 12px; font:12px/1.65 ui-monospace,Consolas,monospace}
textarea,input {color:#e9eff7; background:#0b1522; border:1px solid #36495f; border-radius:8px; padding:11px 12px; width:100%; outline:none}
textarea {resize:vertical} textarea:focus,input:focus {border-color:#64d9bc; box-shadow:0 0 0 2px #64d9bc1a}
input[type=checkbox] {width:auto; accent-color:#64d9bc} button {border:1px solid #3b4c62; border-radius:8px; padding:10px 14px; color:#d7e4f1; background:#213045}
button:hover {background:#2a3d54} button.primary {background:#66dcc1; color:#082a24; border-color:#66dcc1; font-weight:700}
button.primary:hover {background:#8ae8d1} button:disabled,input:disabled,textarea:disabled {opacity:.5; cursor:default}
.actions {display:flex; gap:9px; flex-wrap:wrap; align-items:center} .source-hint {margin-left:auto}
.workspace {display:grid; grid-template-columns:285px minmax(0,1fr); gap:20px; align-items:start}
.list-panel {padding:18px} .list-head {display:flex; justify-content:space-between; align-items:center; margin-bottom:14px}
h2 {font-size:17px; margin:0} #search {font-size:13px; margin-bottom:12px} #entries {display:flex; flex-direction:column; gap:7px; max-height:580px; overflow:auto}
.entry {text-align:left; width:100%; padding:12px; background:transparent; border-color:transparent; border-radius:9px}
.entry.selected {background:#1d3e45; border-color:#38756e} .entry strong {display:block; font-size:14px; overflow-wrap:anywhere}
.entry span {display:block; color:#8ea6bd; font-size:12px; margin-top:4px; overflow-wrap:anywhere} .entry.selected span {color:#a9d6cc}
.empty {color:#91a4ba; padding:26px 10px; text-align:center; line-height:1.8; font-size:14px}
.detail-head {display:flex; justify-content:space-between; align-items:start; gap:15px; padding-bottom:18px; border-bottom:1px solid #2b3b50}
.detail-head h2 {font-size:24px; overflow-wrap:anywhere} #detail-user {margin-top:5px; overflow-wrap:anywhere}
dl {display:grid; grid-template-columns:90px minmax(0,1fr); gap:12px 16px; margin:20px 0; font-size:14px; line-height:1.65}
dt {color:#91a5bd} dd {margin:0; white-space:pre-wrap; overflow-wrap:anywhere} .crypto-note {font-size:12px; color:#8298b1; border-top:1px solid #2b3b50; padding-top:12px; overflow-wrap:anywhere}
.unlock {background:#0e1928; border:1px solid #2d4358; border-radius:12px; padding:17px; margin-top:18px}
.book-password {margin-bottom:20px} .book-password .quiet {margin:8px 0 0}
label {display:block; font-size:13px; color:#a8bcd2; margin-bottom:8px} .master-row {display:flex; gap:9px; align-items:center}
.master-row input {min-width:0; flex:1} .master-row button {flex:none} .reveal-password {display:flex; gap:7px; align-items:center; margin:9px 0 0; font-size:12px}
.password-label {display:flex; align-items:center; justify-content:space-between; margin:18px 0 8px} .password-label label {margin:0}
#plaintext {height:83px; color:#b7f4e3; font-family:ui-monospace,Consolas,monospace; font-size:16px}
.secret-actions {margin-top:10px} .secret-actions .reveal-password {margin:0} #status {margin:18px 0 0; padding:11px 14px; background:#102b29; border:1px solid #28554d; border-radius:9px; color:#b1e9d9; font-size:13px; line-height:1.7; overflow-wrap:anywhere}
#status.error {background:#351e27; border-color:#75404c; color:#ffbac6} footer {margin-top:17px; display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap}
[hidden] {display:none!important}
@media (max-width:760px) {.shell {padding:20px 14px} header {gap:10px} h1 {font-size:24px} .workspace {grid-template-columns:1fr; gap:14px}
  .panel {padding:16px} .source {margin-bottom:14px} #entries {max-height:220px} .source-hint {margin-left:0; width:100%}
  dl {grid-template-columns:76px minmax(0,1fr); gap:10px 12px} .detail-head h2 {font-size:21px}}
@media (max-width:390px) {.master-row {flex-wrap:wrap} .master-row input {flex-basis:100%} header .badge {max-width:82px; text-align:center}}
</style>
<main class="shell">
  <header>
    <div><div class="brand">LOCAL VAULT</div><h1>离线账本查看器</h1></div>
    <span class="badge">离线 · 按条解密</span>
  </header>
  <details class="panel source" id="source-panel" open>
    <summary>打开或粘贴账本</summary>
    <textarea id="source" aria-label="账本文本" placeholder="将从桌面管理端复制的完整账本粘贴到这里。&#10;&#10;[账本]&#10;格式：1&#10;校验码：…&#10;&#10;[条目]&#10;服务名：…&#10;内存KiB：65536&#10;迭代次数：3&#10;并行通道：4" spellcheck="false" autocomplete="off"></textarea>
    <div class="actions">
      <button id="load" class="primary">读取粘贴内容</button>
      <button id="open">打开账本文件</button>
      <button id="clear-book">清空页面</button>
      <span class="quiet source-hint">读取账本不会解密密码。</span>
    </div>
    <input type="file" id="file" accept=".vault,.txt,text/plain" hidden>
  </details>
  <section class="panel book-password" aria-label="管理密码">
    <label for="master">管理密码</label>
    <div class="master-row"><input type="password" id="master" autocomplete="off" spellcheck="false" autocapitalize="off" disabled><button id="lock">锁定账本</button><button id="save-book" disabled>下载账本副本</button></div>
    <label class="reveal-password"><input type="checkbox" id="show-master" disabled>显示管理密码</label>
    <p id="master-state" class="quiet">首次解密成功后会保留管理密码。要换用其他密码，请先锁定账本。</p>
  </section>
  <div class="workspace">
    <aside class="panel list-panel">
      <div class="list-head"><h2>条目</h2><span id="count" class="quiet">未读取账本</span></div>
      <input id="search" aria-label="搜索条目" placeholder="搜索条目" autocomplete="off" spellcheck="false" disabled>
      <div id="entries"><div class="empty">请打开账本文件，或粘贴账本文本。</div></div>
    </aside>
    <section class="panel" aria-label="条目详情">
      <div id="no-selection" class="empty">选择一个条目查看公开资料。<br>需要条目密码时，点击“解密密码”。</div>
      <div id="detail" hidden>
        <div class="detail-head"><div><h2 id="detail-title"></h2><div id="detail-user" class="quiet"></div></div><span class="badge" id="entry-state"></span></div>
        <dl id="metadata"></dl>
        <div class="crypto-note" id="crypto-info"></div>
        <div class="unlock">
          <button class="primary" id="decrypt">解密密码</button>
          <div class="password-label"><label for="plaintext">条目密码</label><span id="plaintext-state" class="quiet">未解密</span></div>
          <textarea id="plaintext" readonly placeholder="解密后可显示或复制条目密码" spellcheck="false" autocomplete="off"></textarea>
          <div class="actions secret-actions">
            <label class="reveal-password"><input type="checkbox" id="show-password" disabled>显示密码</label>
            <button id="copy-password" disabled>复制密码</button>
          </div>
        </div>
      </div>
    </section>
  </div>
  <div id="status" role="status" aria-live="polite">打开或粘贴账本，即可离线查看。</div>
  <footer class="quiet"><span>本页离线运行。账本和密码不会写入浏览器存储。</span><span>切换条目会清空解密结果。换账本时也会清空管理密码。</span></footer>
</main>
<script>
globalThis.VAULT_WASM_BASE64 = '__WASM_BASE64__';
__CIPHER_SOURCE__
__TEXT_SOURCE__
__PROCESS_SOURCE__
__GUI_SOURCE__
</script>
</html>
